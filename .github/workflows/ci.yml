name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, nothing more
permissions:
  contents: read

# If you push again before a run finishes, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # A fresh, empty PostgreSQL database just for this run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database tables
        run: npx prisma migrate deploy

      - name: Load demo data
        run: npm run seed

      - name: Type check and build
        run: npm run build

      - name: Run tests
        run: npm test

  client:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t dash-api ./server

      - name: Build web image
        run: docker build -t dash-web ./client
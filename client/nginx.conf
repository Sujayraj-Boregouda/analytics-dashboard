server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 1. API calls: forward them to the API container
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 2. Built files have unique names, so browsers can keep them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 3. Everything else: serve the React app and let React Router decide the page
  location / {
    try_files $uri $uri/ /index.html;
  }
}